name: BDD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cucumber:
    name: Cucumber (${{ matrix.camada }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        camada: [dominio, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cenários Gherkin na camada ${{ matrix.camada }}
        run: npx cucumber-js --profile ${{ matrix.camada }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-bdd-${{ matrix.camada }}
          path: reports/
          retention-days: 14
